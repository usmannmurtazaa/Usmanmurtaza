<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0c1d" />

  <!-- Favicon set (files live in public/).
       Ordered from legacy to modern so each browser picks the best it supports. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

  <!-- Google Fonts: preconnect + stylesheet.
       Moved here from the CSS @import inside src/styles/global.css.
       - preconnect opens the TLS connection early (fonts.gstatic.com
         requires crossorigin for font files).
       - The stylesheet link is discovered during HTML parsing rather
         than after the CSS bundle has been fetched and parsed.
       - display=swap prevents invisible text during font load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Primary Meta Tags -->
  <title>Usman Murtaza | Full Stack Developer</title>
  <meta name="title" content="Usman Murtaza | Full Stack Developer" />
  <meta name="description"
    content="Usman Murtaza – Full‑stack React developer specializing in high‑performance SaaS interfaces, motion design, and modern glassmorphism UI. Available for hire." />
  <meta name="keywords"
    content="frontend developer, react developer, full stack developer, SaaS, portfolio, usman murtaza, motion design, glassmorphism" />
  <meta name="author" content="Usman Murtaza" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://usmanmurtaza.netlify.app" />
  <meta property="og:title" content="Usman Murtaza | Full Stack Developer" />
  <meta property="og:description"
    content="Portfolio of Usman Murtaza – crafting pixel‑perfect, animated SaaS interfaces with React, Next.js, and motion design." />
  <meta property="og:image" content="https://usmanmurtaza.netlify.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Usman Murtaza Portfolio" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Usman Murtaza | Full Stack Developer" />
  <meta name="twitter:description"
    content="Portfolio of Usman Murtaza – crafting pixel‑perfect, animated SaaS interfaces." />
  <meta name="twitter:image" content="https://usmanmurtaza.netlify.app/og-image.jpg" />
  <meta name="twitter:creator" content="@usman_murtazaa" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "name": "Usman Murtaza",
            "url": "https://usmanmurtaza.netlify.app",
            "jobTitle": "Senior Frontend Engineer",
            "sameAs": [
              "https://github.com/usmanmurtaza",
              "https://linkedin.com/in/usmanmurtaza"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Usman Murtaza Portfolio",
            "url": "https://usmanmurtaza.netlify.app"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Portfolio",
            "applicationCategory": "WebApplication",
            "operatingSystem": "Web",
            "offers": { "@type": "Offer", "price": "0" }
          }
        ]
      }
    </script>

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
