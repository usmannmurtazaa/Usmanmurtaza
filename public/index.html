<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0c1d" />

  <!-- Google Search Console site verification.
       Confirms ownership of the site for search.google.com/search-console.
       Do not remove — Google periodically re-verifies. -->
  <meta name="google-site-verification" content="8tNUALDy2r2_UlsW_1cTKj2dwBiSn_0urgZbIVqXFcM" />

  <!-- Canonical URL. Prevents duplicate-content indexing if the site is
       reached via www subdomain, Netlify preview URL, or trailing-slash
       variants. Uses the production URL already declared in
       netlify.toml and src/utils/seo.js. -->
  <link rel="canonical" href="https://usmanmurtaza.netlify.app" />

  <!-- Favicon set (files live in public/).
       Ordered from legacy to modern so each browser picks the best it supports. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

  <!-- Google Fonts: preconnect + stylesheet.
       - Plus Jakarta Sans → site-wide body font
       - Mr Dafoe → calligraphy signature (primary)
       - Mrs Saint Delafield → calligraphy signature (fallback)
       All three families are fetched in a single request.
       display=swap keeps text visible during font load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mr+Dafoe&family=Mrs+Saint+Delafield&display=swap"
    rel="stylesheet" />

  <!-- Primary Meta Tags.
       Descriptions are tuned to their recommended lengths:
       - meta description ≈ 155 chars (Google truncates around there)
       - og/twitter description ≈ 120 chars (social platforms truncate earlier)
       Leading with name + role + Maniesta + stack means nothing
       important gets cut off. -->
  <title>Usman Murtaza | Full Stack Developer</title>
  <meta name="title" content="Usman Murtaza | Full Stack Developer" />
  <meta name="description"
    content="Usman Murtaza - Full Stack Developer and creator of the Maniesta ecosystem. Building modern web applications with React, Node.js, and MongoDB." />

    content="usman murtaza, usman murtaza developer, usman murtaza full stack developer, usman murtaza react developer, usman murtaza portfolio, full stack developer, react developer, web developer, javascript developer, node.js developer, frontend developer, backend developer, ui/ux designer, web development, react.js, javascript, node.js, modern web applications, portfolio, maniesta, maniesta by usman murtaza, maniesta developer, maniesta ecosystem, maniesta campus, maniesta resume ai, resumeai pro, nexa calculator, zain real estate" />
  <meta name="author" content="Usman Murtaza" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://usmanmurtaza.netlify.app" />
  <meta property="og:title" content="Usman Murtaza | Full Stack Developer" />
  <meta property="og:description"
    content="Full Stack Developer and creator of the Maniesta ecosystem. Building modern web apps with React, Node.js, and MongoDB." />
  <meta property="og:image" content="https://usmanmurtaza.netlify.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Usman Murtaza — Full Stack Developer portfolio preview" />
  <meta property="og:site_name" content="Usman Murtaza Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Usman Murtaza | Full Stack Developer" />
  <meta name="twitter:description"
    content="Full Stack Developer and creator of the Maniesta ecosystem. Building modern web apps with React, Node.js, and MongoDB." />
  <meta name="twitter:image" content="https://usmanmurtaza.netlify.app/og-image.jpg" />
  <meta name="twitter:image:alt"
    content="Usman Murtaza — Full Stack Developer portfolio preview" />
  <meta name="twitter:site" content="@usman_murtazaa" />

  <!-- JSON-LD structured data is injected at runtime by <SchemaMarkup />
       (see src/components/SEO/SchemaMarkup.jsx and src/utils/schema.js).
       Removing the static block here avoids duplicate JSON-LD in the head. -->

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
</head>
